# Роль → исполнитель. С 18.09.2026 Pi — единый runtime (см. карточка
# f3108dcc, спец docs/superpowers/specs/2026-09-18-pi-runtime-facade.md).
# Все восемь ролей исполняются одной машиной, различаясь mcp-профилем
# и ролью в задаче. Имя "pi_runtime" — каноническое; "agent_pi"
# сохранён как legacy-alias для старых карточек (см. SHELL_AGENT_ALIASES
# в server/src/roleRouting.ts и trigger.py:SHELL_AGENT_IDS).
defaults:
  researcher: pi_runtime
  analyst: pi_runtime
  synthesizer: pi_runtime
  critic_verifier: pi_runtime
  architect: pi_runtime
  builder: pi_runtime
  qa: pi_runtime
  designer: pi_runtime

# Запасных исполнителей нет: при исчерпании лимита задача останавливается,
# пока владелец не решит, что подключать дальше.
fallbacks:
  researcher: []
  analyst: []
  synthesizer: []
  critic_verifier: []
  architect: []
  builder: []
  qa: []
  designer: []

# Одна модель Pi по умолчанию. Настройки подключения и ключ модели живут в
# ~/.pi/agent, а не в старых профилях отдельных оболочек.
models:
  researcher: MiniMax-M3
  analyst: MiniMax-M3
  synthesizer: MiniMax-M3
  critic_verifier: MiniMax-M3
  architect: MiniMax-M3
  builder: MiniMax-M3
  qa: MiniMax-M3
  designer: MiniMax-M3
