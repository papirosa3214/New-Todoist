# Ротация лога сервера TaskFlow (.110) — конфиг для logrotate.
#
# Почему нужен: юнит taskflow-server.service пишет stdout/stderr через
#   StandardOutput=append:/home/maksim/Проекты/New-Todoist/server/dev-server.log
#   StandardError=append:...то же
# то есть файл растёт без границ (к 25.10.2026 набрал 1.6 ГБ) и без ротации.
#
# Почему copytruncate, а не обычный rename: node держит этот файл открытым
# на запись (fd 1w/2w). При rename сервис продолжал бы писать в
# dev-server.log.1, а новый dev-server.log остался бы пустым до
# перезапуска юнита. copytruncate копирует содержимое в архив и обрезает
# исходный файл НА МЕСТЕ: inode сохраняется, сервис продолжает писать
# в тот же файл, ничего перезапускать не нужно.
#
# Почему size, а не daily: мусор идёт постоянно, важна граница размера.
# logrotate на .110 запускается раз в сутки (logrotate.timer, 00:00),
# поэтому при текущем темпе файл держится в пределах ~50 МБ + то, что
# набежит между прогонами.
#
# Установка (нужен root):
#   sudo cp server/systemd/taskflow-server-logrotate.conf /etc/logrotate.d/taskflow-server
#   sudo logrotate -d /etc/logrotate.d/taskflow-server   # проверка, без правок
# Далее logrotate.timer будет ротировать файл сам.
/home/maksim/Проекты/New-Todoist/server/dev-server.log {
    size 50M
    rotate 3
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
    missingok
    notifempty
}
